# Pushing a tag like v0.2.0 builds krakendial.exe and publishes it as a GitHub release.
# scripts/install.ps1 downloads the latest one.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # The app compares the release's tag with its own version, so a tag that differs from
      # Cargo.toml would be offered as an update over and over.
      - name: Tag matches the version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }} does not match version $version in Cargo.toml" }
      - run: cargo test
      - run: node tests/web.js
      - run: cargo build --release
      - name: Checksum
        shell: pwsh
        run: |
          Copy-Item target\release\krakendial.exe krakendial.exe
          "$((Get-FileHash krakendial.exe -Algorithm SHA256).Hash.ToLower())  krakendial.exe" | Out-File -Encoding ascii krakendial.exe.sha256
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" krakendial.exe krakendial.exe.sha256 --title "KrakenDial ${{ github.ref_name }}" --generate-notes
