[package]
name = "krakendial"
version = "0.1.0"
edition = "2021"
authors = ["kleju13"]
description = "A dial and face editor for the NZXT Kraken Elite LCD, through NZXT CAM's Web Integration"
repository = "https://github.com/kleju13/krakendial"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
