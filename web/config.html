<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="cfg.title">Kraken LCD · settings</title>
<link rel="stylesheet" href="dial.css">
<style>
  :root {
    --page: #08101f; --panel: #0e1a30; --line: #1c2c4a; --text: #e9f1ff; --muted: #8ea3c4; --dim: #5a7096;
    --accent: #5b9cff; --warn: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: radial-gradient(1200px 700px at 20% -10%, #12254a 0%, var(--page) 60%);
    color: var(--text); font-family: Bahnschrift, "DIN Alternate", system-ui, sans-serif;
  }
  main { display: grid; grid-template-columns: minmax(260px, 400px) 1fr; gap: 40px; max-width: 1240px; margin: 0 auto; padding: 36px 32px 48px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .stage { position: sticky; top: 28px; align-self: start; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .brand { align-self: stretch; font-size: 14px; font-weight: 600; letter-spacing: 0.26em; color: var(--muted); }
  .cap {
    width: 100%; max-width: 380px; aspect-ratio: 1; border-radius: 50%; padding: 14px;
    background: radial-gradient(circle at 32% 24%, #ffffff 0%, #e9edf3 45%, #c9d1dc 100%);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.06), inset 0 -3px 6px rgba(0, 0, 0, 0.12);
  }
  .cap > div { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 0 4px #0b0f16; }
  .status { width: 100%; display: grid; gap: 8px; font-size: 14px; color: var(--muted); }
  .status div { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .status div[hidden] { display: none; }
  .status b { font-weight: 500; color: var(--text); text-align: right; }
  .status .bad { color: var(--warn); }
  .status .off { color: var(--dim); }
  .langs { align-self: stretch; justify-content: center; }
  .langs .chip { padding: 7px 14px; font-size: 13px; }

  section { margin-bottom: 34px; }
  h2 { margin: 0 0 14px; font-size: 13px; font-weight: 600; letter-spacing: 0.24em; color: var(--muted); }
  .grid { display: grid; gap: 14px; }
  .layouts { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .themes { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
  .bgs { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }

  .opt {
    all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 10px 12px;
    border-radius: 14px; background: var(--panel); border: 1.5px solid transparent;
    transition: border-color 0.25s, transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1), background 0.25s;
  }
  .opt:hover { transform: translateY(-2px); background: #12213c; }
  .opt:focus-visible { border-color: var(--dim); }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: #112347; }
  .thumb { width: 100%; max-width: 132px; aspect-ratio: 1; border-radius: 50%; box-shadow: 0 0 0 3px #060a12; }
  .bgs .thumb { max-width: 76px; }
  .media { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); }
  .media .thumb { max-width: 92px; }
  .media .opt, .faces .opt { position: relative; }
  .media .opt b, .faces .opt b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .del, .edit { position: absolute; top: 8px; right: 8px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; color: var(--muted);
    background: rgba(8, 16, 31, 0.85); text-decoration: none; opacity: 0; transition: opacity 0.2s; }
  .opt:hover .del, .del.sure, .opt:hover .edit, .edit:focus-visible { opacity: 1; }
  .del:hover, .del.sure { color: var(--warn); }
  .edit:hover { color: var(--text); }
  .add .thumb { display: grid; place-items: center; font-size: 34px; color: var(--muted); box-shadow: none; border: 1.5px dashed var(--dim); }
  a.opt { color: inherit; text-decoration: none; }
  .busy { cursor: default; opacity: 0.7; }
  .busy .thumb { box-shadow: none; border: 1.5px dashed var(--dim); }
  .opt b { font-size: 14px; font-weight: 600; letter-spacing: 0.04em; }
  .opt small { font-size: 12.5px; line-height: 1.35; color: var(--muted); text-align: center; }

  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .grid + .chips { margin-top: 16px; }
  .chip { all: unset; cursor: pointer; padding: 10px 18px; border-radius: 999px; background: var(--panel); border: 1.5px solid transparent; font-size: 14px; }
  .chip:focus-visible { border-color: var(--dim); }
  .chip.pet { display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 12px; }
  .chip.pet svg { width: 34px; height: 30px; }
  .pet .px-X { fill: var(--accent); } .pet .px-o { fill: #b4d2ff; } .pet .px-W { fill: #f7faff; } .pet .px-K { fill: var(--page); }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: #112347; }
  .hint { margin-top: 10px; font-size: 13px; color: var(--dim); }
  .hint.bad { color: var(--warn); }
  .row { display: flex; gap: 10px; }
  .field { flex: 1; min-width: 0; padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--panel);
    color: var(--text); font: inherit; font-size: 14px; }
  .field:focus { outline: none; border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <aside class="stage">
    <div class="brand">KRAKEN LCD</div>
    <div class="cap"><div id="preview"></div></div>
    <div class="status">
      <div><span data-t="cfg.cooler"></span> <b id="s-lcd">…</b></div>
      <div><span data-t="cfg.usage"></span> <b id="s-usage">…</b></div>
      <div id="s-machines-row" hidden><span data-t="cfg.machines"></span> <b id="s-machines">…</b></div>
    </div>
    <div class="chips langs" id="langs"></div>
  </aside>
  <div>
    <section><h2 data-t="cfg.layout"></h2><div class="grid layouts" id="layouts"></div></section>
    <section><h2 data-t="cfg.faces"></h2><div class="grid layouts faces" id="faces"></div>
      <div class="hint" data-t="cfg.facesHint"></div></section>
    <section><h2 data-t="cfg.mascot"></h2><div class="chips" id="mascots"></div>
      <div class="hint" data-t="cfg.mascotHint"></div></section>
    <section><h2 data-t="cfg.units"></h2><div class="chips" id="units"></div>
      <div class="hint" data-t="cfg.unitsHint"></div></section>
    <section><h2 data-t="cfg.bars"></h2><div class="chips" id="hwbars"></div>
      <div class="hint" data-t="cfg.barsHint"></div></section>
    <section><h2 data-t="cfg.theme"></h2><div class="grid themes" id="themes"></div></section>
    <section><h2 data-t="cfg.bg"></h2><div class="grid bgs" id="bgs"></div>
      <div class="hint" data-t="cfg.bgHint"></div></section>
    <section><h2 data-t="cfg.media"></h2><div class="grid media" id="media"></div>
      <div class="chips" id="looks"></div>
      <div class="hint" id="media-hint" data-t="cfg.mediaHint"></div></section>
    <section><h2 data-t="cfg.fps"></h2><div class="chips" id="fps"></div>
      <div class="hint" data-t="cfg.fpsHint"></div></section>
    <section><h2 data-t="cfg.cost"></h2><div class="chips" id="costs"></div>
      <div class="hint" data-t="cfg.costHint"></div></section>
    <section><h2 data-t="cfg.source"></h2>
      <form class="row" id="usage-form"><input class="field" id="usage" type="url" placeholder="https://…/api/summary" spellcheck="false" autocomplete="off">
        <button class="chip" data-t="cfg.sourceSave"></button></form>
      <div class="hint" id="usage-hint" data-t="cfg.sourceHint"></div></section>
  </div>
</main>
<script src="bg.js"></script>
<script src="i18n.js"></script>
<script src="dial.js"></script>
<script src="faces.js"></script>
<script>
(() => {
  const K = KrakenDial, I = KrakenI18n, t = I.t;
  const FPS = [[10, "10 fps"], [20, "20 fps"], [30, "30 fps"]];
  const UNITS = [["left", "cfg.left"], ["used", "cfg.used"]];
  const BARS = [["load", "cfg.barsLoad"], ["temp", "cfg.barsTemp"]];
  const LOOKS = [["plain", "cfg.lookPlain"], ["raw", "cfg.lookRaw"], ["ascii", "cfg.lookAscii"]];
  let state = { limits: {}, costs: null, interval: 60e3, config: null, hw: null };
  const cfg = () => ({
    layout: "rotation", theme: "ice", bg: "liquid", fps: 10, units: "left", look: "plain", mascot: "kraken", cost: "last24h",
    bars: "load", lang: "auto", usage: "", ...(state.config || {}),
  });
  const byId = (id) => document.getElementById(id);

  const preview = K.create(byId("preview"), cfg());

  function option(parent, cls, html, onPick) {
    const b = document.createElement("button");
    b.className = cls;
    b.innerHTML = html;
    b.onclick = onPick;
    parent.appendChild(b);
    return b;
  }
  // A button with a picture and a caption. Names go in as text, never as markup: faces and
  // media are named by the user.
  function card(parent, title, small, onPick) {
    const b = option(parent, "opt", `<div class="thumb"></div><b></b>${small == null ? "" : "<small></small>"}`, onPick);
    b.querySelector("b").textContent = title;
    if (small != null) b.querySelector("small").textContent = small;
    return b;
  }
  function chip(parent, label, onPick) {
    const b = option(parent, "chip", "", onPick);
    b.textContent = label;
    return b;
  }
  const host = (id) => {
    const n = byId(id);
    n.replaceChildren();
    return n;
  };

  // ---------- the lists, in the current language ----------

  // opts[setting]: its options; `key` is the value each one sets, so the saved one is pressed
  let opts = {}, builtLang = null;
  function build() {
    builtLang = I.lang;
    document.documentElement.lang = I.lang;
    for (const n of document.querySelectorAll("[data-t]")) n.textContent = t(n.dataset.t);
    const c = cfg();
    const langs = host("langs");
    opts.lang = [["auto", t("cfg.auto")], ...I.LANGS.map((l) => [l.id, l.name])].map(([key, label]) => ({ key, b: chip(langs, label, () => save({ lang: key })) }));
    const layouts = host("layouts");
    opts.layout = K.LAYOUTS.map((l) => {
      const b = card(layouts, l.name, l.desc, () => save({ layout: l.id }));
      return { key: l.id, b, dial: K.create(b.querySelector(".thumb"), { layout: l.id, theme: c.theme, bg: "none", animate: false }) };
    });
    const themes = host("themes");
    opts.theme = K.THEMES.map((th) => {
      const b = card(themes, th.name, null, () => save({ theme: th.id }));
      return { key: th.id, b, dial: K.create(b.querySelector(".thumb"), { layout: "cockpit", theme: th.id, bg: "none", animate: false }) };
    });
    const bgs = host("bgs");
    bgOpts = K.BGS.map((g) => swatch(card(bgs, g.name, null, () => save({ bg: g.id })), g.id));
    const units = host("units");
    opts.units = UNITS.map(([key, label]) => ({ key, b: chip(units, t(label), () => save({ units: key })) }));
    const bars = host("hwbars");
    opts.bars = BARS.map(([key, label]) => ({ key, b: chip(bars, t(label), () => save({ bars: key })) }));
    const mascots = host("mascots");
    opts.mascot = K.MASCOTS.map((m) => {
      // a mascot picked while the dial has none switches to a layout where it lives
      const b = option(mascots, "chip pet", "<svg></svg><span></span>", () =>
        save({ mascot: m.id, ...(K.LAYOUTS.find((l) => l.id === cfg().layout)?.mascot || K.isFace(cfg().layout) ? {} : { layout: "neofetch" }) }));
      b.querySelector("span").textContent = m.name;
      K.mascotIcon(b.querySelector("svg"), m.id);
      return { key: m.id, b };
    });
    const looks = host("looks");
    opts.look = LOOKS.map(([key, label]) => ({ key, b: chip(looks, t(label), () => save({ look: key })) }));
    const fps = host("fps");
    opts.fps = FPS.map(([key, label]) => ({ key, b: chip(fps, label, () => save({ fps: key })) }));
    const costs = host("costs");
    opts.cost = K.COSTS.map((co) => ({ key: co.id, b: chip(costs, co.name, () => save({ cost: co.id })) }));
    usageHint.classList.remove("bad");
    buildMedia();
    buildFaces();
    minisKey = "";
  }

  async function save(patch) {
    state.config = { ...cfg(), ...patch };
    render();
    try {
      const r = await fetch("/api/config", { method: "POST", body: JSON.stringify(patch) });
      if (r.ok) state.config = await r.json();
    } catch (_) {}
    render();
  }

  // ---------- backgrounds ----------

  // A background swatch: still until hovered.
  function swatch(b, id) {
    const o = { key: id, b, el: b.querySelector(".thumb"), theme: null, look: null, back: null };
    b.onmouseenter = () => o.back && o.back.play();
    b.addEventListener("mouseleave", () => o.back && o.back.pause());
    return o;
  }
  let bgOpts = [];

  const mediaHost = byId("media");
  let mediaList = [], mediaKey = null, mediaOpts = [], uploading = null, pending = null;
  const stem = (n) => n.replace(/\.[^.]+$/, "");

  function buildMedia() {
    mediaHost.replaceChildren();
    mediaOpts = mediaList.map((m) => {
      const id = `media:${m.name}`;
      const b = card(mediaHost, stem(m.name), null, () => save({ bg: id }));
      b.title = m.name;
      const del = document.createElement("span");
      del.className = "del";
      del.textContent = t("cfg.delete");
      b.appendChild(del);
      del.onclick = (e) => {
        e.stopPropagation();
        if (del.classList.contains("sure")) return remove(m.name);
        del.classList.add("sure");
        del.textContent = t("cfg.sure");
      };
      b.addEventListener("mouseleave", () => {
        del.classList.remove("sure");
        del.textContent = t("cfg.delete");
      });
      return swatch(b, id);
    });
    if (uploading || pending) {
      const w = document.createElement("div");
      w.className = "opt busy";
      w.innerHTML = `<div class="thumb"></div><b></b><small></small>`;
      w.querySelector("b").textContent = stem(uploading || pending);
      w.querySelector("small").textContent = t(uploading ? "cfg.uploading" : "cfg.converting");
      mediaHost.appendChild(w);
    }
    const add = document.createElement("label");
    add.className = "opt add";
    add.innerHTML = `<div class="thumb">+</div><b></b><small></small><input type="file" accept="video/*,image/*" hidden>`;
    add.querySelector("b").textContent = t("cfg.add");
    add.querySelector("small").textContent = t("cfg.addSub");
    add.querySelector("input").onchange = (e) => e.target.files[0] && upload(e.target.files[0]);
    mediaHost.appendChild(add);
    render();
  }

  async function loadMedia() {
    try {
      const r = await fetch("/api/media", { cache: "no-store" });
      if (r.ok) mediaList = await r.json();
    } catch (_) {}
    // A converted upload shows up under its final name once ffmpeg is done; then select it.
    const ready = pending && mediaList.some((m) => m.name === pending);
    if (ready) {
      save({ bg: `media:${pending}` });
      pending = null;
    }
    const key = JSON.stringify([mediaList, uploading, pending]);
    if (key !== mediaKey) {
      mediaKey = key;
      buildMedia();
    }
  }

  async function upload(file) {
    const hint = byId("media-hint");
    const name = file.name.replace(/[^\p{L}\p{N} ._()-]/gu, "-").replace(/^\.+/, "").slice(-120);
    uploading = name;
    hint.textContent = t("cfg.mediaHint");
    hint.classList.remove("bad");
    await loadMedia();
    try {
      const r = await fetch(`/api/media?name=${encodeURIComponent(name)}`, { method: "POST", body: file });
      if (!r.ok) throw new Error(await r.text());
      pending = (await r.json()).name;
    } catch (e) {
      hint.textContent = t("cfg.addFailed", { name, msg: e.message });
      hint.classList.add("bad");
    }
    uploading = null;
    loadMedia();
  }

  async function remove(name) {
    await fetch(`/api/media?name=${encodeURIComponent(name)}`, { method: "DELETE" }).catch(() => {});
    await poll();
    loadMedia();
  }

  // ---------- my faces ----------

  const facesHost = byId("faces");
  let faces = [], facesKey = null, faceOpts = [];
  const faceOf = (layout) => faces.find((f) => `face:${f.id}` === layout) || (state.face && `face:${state.face.id}` === layout ? state.face : null);

  function buildFaces() {
    facesHost.replaceChildren();
    const c = cfg();
    faceOpts = faces.map((f) => {
      const key = `face:${f.id}`;
      const b = card(facesHost, f.name, null, () => save({ layout: key }));
      const edit = document.createElement("a");
      edit.className = "edit";
      edit.href = `/editor?face=${encodeURIComponent(f.id)}`;
      edit.textContent = t("cfg.edit");
      edit.onclick = (e) => e.stopPropagation();
      b.appendChild(edit);
      return { key, b, face: f, dial: K.create(b.querySelector(".thumb"), { layout: key, face: f, theme: c.theme, bg: "none", animate: false }) };
    });
    const add = document.createElement("a");
    add.className = "opt add";
    add.href = "/editor?new=1";
    add.innerHTML = `<div class="thumb">+</div><b></b><small></small>`;
    add.querySelector("b").textContent = t("cfg.newFace");
    add.querySelector("small").textContent = t("cfg.newFaceSub");
    facesHost.appendChild(add);
    minisKey = "";
    render();
  }

  async function loadFaces() {
    try {
      const r = await fetch("/api/faces", { cache: "no-store" });
      if (r.ok) faces = await r.json();
    } catch (_) {}
    const key = JSON.stringify(faces);
    if (key !== facesKey) {
      facesKey = key;
      buildFaces();
    }
  }

  // ---------- usage source ----------

  const usageInput = byId("usage"), usageHint = byId("usage-hint");
  byId("usage-form").onsubmit = async (e) => {
    e.preventDefault();
    const v = usageInput.value.trim();
    if (v && !/^https?:\/\/\S+$/.test(v)) {
      usageHint.textContent = t("cfg.sourceBad");
      usageHint.classList.add("bad");
      return;
    }
    usageInput.blur();
    await save({ usage: v });
    usageHint.classList.remove("bad");
    usageHint.textContent = `${t("cfg.sourceSaved")} ${t("cfg.sourceHint")}`;
  };

  // ---------- drawing ----------

  let minisAt = 0, minisKey = "";
  function render() {
    if (!builtLang) return;
    const c = cfg();
    const now = Date.now();
    const face = faceOf(c.layout);
    const key = `${c.layout}|${c.theme}|${c.bg}|${c.units}|${c.look}|${c.mascot}|${c.cost}|${c.bars}|${c.lang}|${face ? JSON.stringify(face) : ""}`;
    const minis = key !== minisKey || now - minisAt > 5e3;
    if (minis) {
      minisKey = key;
      minisAt = now;
    }
    const live = state.hw && state.hw.at && now - state.hw.at < 15e3;
    const data = { now, hw: live ? state.hw : K.emptyHw(), limits: state.limits, costs: state.costs, interval: state.interval, mode: live ? state.hw.mode : "work" };

    preview.configure({ ...c, face });
    preview.update(data);
    const same = { units: c.units, mascot: c.mascot, cost: c.cost, bars: c.bars };
    if (minis) {
      for (const o of opts.layout || []) {
        o.dial.configure({ layout: o.key, theme: c.theme, bg: "none", ...same });
        o.dial.update(data);
      }
      // each theme shows the layout on the dial now
      for (const o of opts.theme || []) {
        o.dial.configure({ layout: c.layout, face, theme: o.key, bg: "none", ...same });
        o.dial.update(data);
      }
      for (const o of faceOpts) {
        o.dial.configure({ layout: o.key, face: o.face, theme: c.theme, bg: "none", ...same });
        o.dial.update(data);
      }
    }
    for (const o of faceOpts) o.b.setAttribute("aria-pressed", String(o.key === c.layout));
    for (const o of bgOpts.concat(mediaOpts)) {
      o.b.setAttribute("aria-pressed", String(o.key === c.bg));
      const look = o.key.startsWith("media:") ? c.look : "plain";
      if (o.theme !== c.theme || o.look !== look) {
        o.back = K.background(o.el, { theme: c.theme, bg: o.key, look });
        o.theme = c.theme;
        o.look = look;
      }
    }
    for (const [setting, list] of Object.entries(opts)) for (const o of list) o.b.setAttribute("aria-pressed", String(o.key === c[setting]));
    if (document.activeElement !== usageInput && usageInput.value !== c.usage) usageInput.value = c.usage;

    const lcd = byId("s-lcd");
    lcd.textContent = t(live ? "cfg.live" : "cfg.noSignal");
    lcd.className = live ? "" : "bad";
    // the usage source: when it last fetched the limits, or why it can't be read
    const ls = Object.values(state.limits || {}).filter(Boolean);
    const err = (ls.find((l) => l.error) || {}).error;
    const last = Math.max(0, ...ls.map((l) => l.fetchedAt || 0));
    const at = last ? new Date(last).toLocaleTimeString(I.locale) : null;
    const usage = byId("s-usage");
    if (!c.usage) [usage.textContent, usage.className] = [t("cfg.usageOff"), "off"];
    else if (err && err !== "unset") [usage.textContent, usage.className] = [at ? t("cfg.usageLast", { err: K.errText(err), t: at }) : K.errText(err), "bad"];
    else [usage.textContent, usage.className] = [at ? t("cfg.usageSynced", { t: at }) : t("cfg.usageWaiting"), ""];
    // the machines whose costs the source adds up, by name when some are offline; only if it sends them
    const ms = (state.costs && state.costs.machines) || [];
    const off = ms.filter((m) => m.status !== "online");
    byId("s-machines-row").hidden = !ms.length;
    const machines = byId("s-machines");
    machines.textContent = off.length ? t("cfg.machinesOffline", { names: off.map((m) => m.name).join(", ") }) : t("cfg.machinesOnline", { n: ms.length });
    machines.className = off.length ? "bad" : "";
  }

  let serviceBuild = null;
  async function poll() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (r.ok) state = await r.json();
      if (serviceBuild && state.build !== serviceBuild) return location.reload();
      serviceBuild = state.build;
    } catch (_) {
      if (builtLang) byId("s-lcd").textContent = t("cfg.down");
    }
    // The page is built in the saved language, so the first settings build it; another
    // language later builds it again.
    const want = I.resolve(state.config ? state.config.lang : "auto");
    if (want !== builtLang) {
      I.use(want);
      build();
    }
    render();
  }
  poll().then(() => {
    loadMedia();
    loadFaces();
  });
  setInterval(poll, 2000);
  setInterval(loadMedia, 3000);
  setInterval(loadFaces, 5000);
  setInterval(render, 1000);
})();
</script>
