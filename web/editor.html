<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="ed.title">KrakenDial · face editor</title>
<link rel="stylesheet" href="dial.css">
<style>
  :root {
    --page: #08101f; --panel: #0e1a30; --panel-2: #12213c; --line: #1c2c4a; --text: #e9f1ff; --muted: #8ea3c4; --dim: #5a7096;
    --accent: #5b9cff; --warn: #ff6b6b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: radial-gradient(1200px 700px at 50% -10%, #12254a 0%, var(--page) 60%);
    color: var(--text); font-family: Bahnschrift, "DIN Alternate", system-ui, sans-serif; font-size: 14px;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .btn { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 999px; background: var(--panel); border: 1.5px solid transparent; white-space: nowrap; }
  .btn:hover { background: var(--panel-2); }
  .btn:focus-visible { border-color: var(--dim); }
  .btn[disabled] { opacity: 0.4; cursor: default; }
  .btn.on { border-color: var(--accent); background: #112347; }
  .btn.bad { color: var(--warn); }
  .btn.icon { padding: 8px 11px; }
  .btn.primary { background: var(--accent); color: #04101f; font-weight: 600; }
  .btn.primary:hover { background: #7db2ff; }
  .btn.primary.on { background: #112347; color: var(--text); border-color: var(--accent); }

  header { display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; position: relative; z-index: 5; }
  header a.btn { text-decoration: none; }
  header .btn { padding: 8px 12px; }
  header .btn.icon { padding: 8px 11px; }
  .sep { flex: 1; }
  .field { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--panel); min-width: 0; }
  .field:focus { outline: none; border-color: var(--accent); }
  #name { width: 180px; }
  #faces { max-width: 180px; }
  #faces:empty { display: none; }
  #saved { color: var(--dim); min-width: 70px; text-align: right; }
  #saved.bad { color: var(--warn); }
  .menu-wrap { position: relative; }
  .menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 170px; padding: 6px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); display: grid; gap: 2px; }
  .menu[hidden] { display: none; }
  .menu .btn { border-radius: 10px; background: none; }
  .menu .btn:hover { background: var(--panel-2); }

  .work { display: grid; grid-template-columns: 236px 1fr 340px; min-height: 0; }
  .side { overflow: auto; padding: 16px 14px 28px; border-right: 1px solid var(--line); }
  .side.right { border-right: 0; border-left: 1px solid var(--line); padding-top: 12px; }
  h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.24em; color: var(--muted); }
  h3 { margin: 14px 0 6px; font-size: 11.5px; font-weight: 500; letter-spacing: 0.08em; color: var(--dim); }
  /* fixed halves, the label under the icon: long words (Polish ones) fit without widening the column */
  .palette { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .tool { all: unset; cursor: grab; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 8px 4px 7px; border-radius: 10px; text-align: center;
    background: var(--panel); border: 1.5px solid transparent; font-size: 12.5px; line-height: 1.2; touch-action: none; }
  .tool span { max-width: 100%; overflow-wrap: anywhere; }
  .tool:hover { background: var(--panel-2); }
  .tool:focus-visible { border-color: var(--dim); }
  .tool i { font-style: normal; flex: none; font-size: 15px; line-height: 1.1; color: var(--accent); font-family: "Cascadia Mono", Consolas, monospace; }
  .blocks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
  .block { all: unset; cursor: grab; display: grid; justify-items: center; gap: 4px; padding: 8px 4px 7px; border-radius: 12px; background: var(--panel);
    border: 1.5px solid transparent; font-size: 12px; text-align: center; touch-action: none; }
  .block:hover { background: var(--panel-2); }
  .block:focus-visible { border-color: var(--dim); }
  .block .thumb { width: 64px; aspect-ratio: 1; border-radius: 50%; box-shadow: 0 0 0 2px #060a12; pointer-events: none; }
  .ghost { position: fixed; z-index: 50; pointer-events: none; padding: 6px 10px; border-radius: 10px; background: var(--accent); color: #04101f; font-weight: 600;
    font-size: 12.5px; transform: translate(-50%, -50%); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }

  .tabs { display: flex; gap: 4px; padding: 4px; margin-bottom: 16px; border-radius: 999px; background: var(--panel); }
  .tabs .btn { flex: 1; text-align: center; padding: 7px 8px; font-size: 13px; background: none; }
  .tabs .btn.on { background: #112347; }
  .pane[hidden] { display: none; }
  .pane > h2 { margin-top: 4px; }
  .pane > h2 ~ h2 { margin-top: 22px; }

  .layers { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .layer { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 10px; border-radius: 10px; cursor: pointer; border: 1.5px solid transparent; }
  .layer:hover { background: var(--panel); }
  .layer.sel { background: #112347; border-color: var(--accent); }
  .layer.off span { opacity: 0.45; }
  .layer i { font-style: normal; width: 24px; text-align: center; color: var(--accent); font-family: "Cascadia Mono", Consolas, monospace; }
  .layer span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer button { all: unset; cursor: pointer; padding: 2px 6px; border-radius: 6px; color: var(--dim); }
  .layer button:hover { color: var(--text); background: var(--panel-2); }
  .empty { color: var(--dim); font-size: 13px; line-height: 1.45; }

  .center { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px; min-width: 0; min-height: 0; }
  .stage { position: relative; width: min(100%, calc(100vh - 190px)); aspect-ratio: 1; touch-action: none; }
  .stage > .dial { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 6px #0b0f16, 0 30px 70px rgba(0, 0, 0, 0.5); }
  .stage > svg { position: absolute; inset: -8%; width: 116%; height: 116%; overflow: visible; pointer-events: none; }
  .stage .rim { fill: none; stroke: var(--dim); stroke-width: 1.5; stroke-dasharray: 4 6; }
  .stage .box { fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .stage .box.more { stroke-dasharray: 5 4; }
  .stage .marquee { fill: rgba(91, 156, 255, 0.08); stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
  .stage .handle { fill: var(--accent); stroke: var(--page); stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: all; cursor: nwse-resize; }
  .stage .guide { stroke: #ff5fd2; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .stage.dragging { cursor: grabbing; }
  .stage.drop > .dial { box-shadow: 0 0 0 6px var(--accent), 0 30px 70px rgba(0, 0, 0, 0.5); }
  .hello { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 62%; display: grid; justify-items: center; gap: 14px; padding: 22px;
    border-radius: 20px; background: rgba(8, 16, 31, 0.86); text-align: center; line-height: 1.45; color: var(--muted); }
  .hello[hidden] { display: none; }
  .caption { color: var(--dim); font-size: 12.5px; text-align: center; max-width: 640px; line-height: 1.45; }

  .props { display: grid; gap: 14px; }
  .prop { display: grid; gap: 6px; }
  .prop > label { font-size: 12.5px; color: var(--muted); }
  .prop .hint, .pane .hint { font-size: 12px; color: var(--dim); line-height: 1.4; }
  .num { display: grid; grid-template-columns: 1fr 74px; gap: 10px; align-items: center; }
  .num input[type=number] { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--panel); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  textarea.field { border-radius: 12px; min-height: 92px; resize: vertical; font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; }
  select.field { border-radius: 10px; padding: 8px 10px; background: var(--panel); }
  select.field option, select.field optgroup { background: var(--panel); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg .btn { padding: 6px 12px; font-size: 13px; }
  .check { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .sw { all: unset; cursor: pointer; width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 0 0 2px var(--line); }
  .sw.on { box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--accent); }
  .swatches input[type=color] { width: 30px; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .actions .btn { padding: 6px 11px; font-size: 13px; }
  .xy { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .xy input { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--panel); }
  .what { font-size: 16px; font-weight: 600; letter-spacing: 0.04em; }

  /* the look: themes and backgrounds to pick from */
  .looks { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; }
  .looks.bgs { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; }
  .pick { all: unset; cursor: pointer; display: grid; place-items: center; aspect-ratio: 1; border-radius: 50%; position: relative; }
  .pick:focus-visible { outline: 2px solid var(--dim); outline-offset: 2px; }
  .pick[aria-pressed="true"]::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent); }
  .pick.th { box-shadow: inset 0 0 0 3.5px var(--fill); }
  .pick.th i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); }
  .pick .thumb { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
  .pick.add { border: 1.5px dashed var(--dim); color: var(--muted); font-size: 20px; }
  .pick.busy { border: 1.5px dashed var(--dim); opacity: 0.6; cursor: default; }
  .follow { margin-bottom: 12px; padding: 6px 12px; font-size: 13px; }
  .follow small { color: var(--dim); font-size: 12px; }
  .btn[aria-pressed="true"] { border-color: var(--accent); background: #112347; }
  .chosen { margin: -4px 0 10px; font-size: 13px; color: var(--muted); }
  .chosen b { color: var(--text); font-weight: 500; }

  /* new face: ready faces to start from */
  .modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(3, 7, 15, 0.72); }
  .modal[hidden] { display: none; }
  .sheet { width: min(1100px, calc(100vw - 48px)); max-height: calc(100vh - 48px); overflow: auto; padding: 26px 28px 30px; border-radius: 22px;
    background: var(--panel); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
  .sheet h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
  .sheet > p { margin: 0 0 18px; color: var(--muted); line-height: 1.45; }
  .sheet h3 { margin: 20px 0 10px; font-size: 12px; letter-spacing: 0.2em; color: var(--muted); }
  .tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .tpl { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 8px; padding: 12px 6px 10px; border-radius: 14px; font-size: 13px; text-align: center; }
  .tpl:hover, .tpl:focus-visible { background: var(--panel-2); }
  .tpl .thumb { width: 108px; aspect-ratio: 1; border-radius: 50%; box-shadow: 0 0 0 3px #060a12; }
  .tpl.blank .thumb { display: grid; place-items: center; font-size: 34px; color: var(--muted); box-shadow: none; border: 1.5px dashed var(--dim); }
  .sheet .close { float: right; }

  @media (max-width: 1150px) { .work { grid-template-columns: 210px 1fr 290px; } }
</style>
</head>
<body>
<header>
  <a class="btn" href="/" data-t="ed.back"></a>
  <select class="field" id="faces" aria-label="Face"></select>
  <input class="field" id="name" maxlength="60" spellcheck="false" aria-label="Name">
  <button class="btn" id="new" data-t="ed.new"></button>
  <button class="btn" id="duplicate" data-t="ed.duplicate"></button>
  <div class="menu-wrap">
    <button class="btn icon" id="more" aria-haspopup="true">⋯</button>
    <div class="menu" id="menu" hidden>
      <button class="btn" id="import" data-t="ed.import"></button>
      <button class="btn" id="export" data-t="ed.export"></button>
      <button class="btn" id="delete" data-t="ed.delete"></button>
    </div>
  </div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <span class="sep"></span>
  <button class="btn icon" id="undo">↶</button>
  <button class="btn icon" id="redo">↷</button>
  <span id="saved"></span>
  <button class="btn primary" id="show"></button>
</header>
<div class="work">
  <aside class="side">
    <h2 data-t="ed.blocks"></h2>
    <div class="blocks" id="blocks"></div>
    <h2 data-t="ed.add"></h2>
    <div id="palette"></div>
  </aside>
  <div class="center">
    <div class="stage" id="stage">
      <div class="dial" id="dial"></div>
      <svg viewBox="-51.2 -51.2 742.4 742.4" id="overlay"></svg>
      <div class="hello" id="hello" hidden>
        <span data-t="ed.hello"></span>
        <button class="btn primary" id="hello-new" data-t="ed.helloNew"></button>
      </div>
    </div>
    <div class="caption" id="caption"></div>
    <div class="caption" data-t="ed.keys"></div>
  </div>
  <aside class="side right">
    <div class="tabs" role="tablist">
      <button class="btn" id="tab-look" data-t="ed.tabLook"></button>
      <button class="btn" id="tab-widget" data-t="ed.tabWidget"></button>
      <button class="btn" id="tab-layers" data-t="ed.tabLayers"></button>
    </div>
    <div class="pane" id="look"></div>
    <div class="pane props" id="props"></div>
    <div class="pane" id="layers-pane"><div class="layers" id="layers"></div></div>
  </aside>
</div>
<div class="modal" id="templates" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="btn close" id="templates-close" data-t="ed.close"></button>
    <h1 data-t="ed.newTitle"></h1>
    <p data-t="ed.newSub"></p>
    <div id="tpl-list"></div>
  </div>
</div>
<script src="bg.js"></script>
<script src="i18n.js"></script>
<script src="dial.js"></script>
<script src="faces.js"></script>
<script src="editor.js"></script>
</body>
</html>
